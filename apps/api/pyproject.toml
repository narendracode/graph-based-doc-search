[project]
name = "nbcc-api"
version = "0.1.0"
description = "NBCC document archival API + ingestion worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "redis>=5.1",
    "rq>=2.0",
    "neo4j>=5.24",
    "ollama>=0.3.3",
    "unstructured[pdf]>=0.15.13",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "torch>=2.0",
    "torchvision>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.9",
]

[tool.uv]
package = false

# unstructured's PDF layout-detection path pulls in torch/torchvision. Left to the
# default PyPI index, pip/uv resolve torch's linux wheel, which drags in several GB of
# nvidia-* CUDA runtime packages we'll never use (no GPU in this container). Pin both
# to PyTorch's CPU-only wheel index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
